name: Packaging Validation

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Optional version string to package (defaults to Cargo.toml version)'
        required: false
        default: ''
  push:
    tags:
      - 'v*-rc*'
      - 'v*-beta*'
      - 'v*-alpha*'

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-metadata:
    name: Verify Package Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Determine target package version
        id: get-version
        run: |
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="lavaterm") | .version')
          OVERRIDE="${{ github.event.inputs.version_override }}"
          VERSION="${OVERRIDE:-$CARGO_VERSION}"

          echo "Detected Cargo Package Ver: $CARGO_VERSION"
          echo "Packaging Target Ver:       $VERSION"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  package-linux:
    name: Validate Linux Packaging (AppImage & DEB x86_64)
    needs: verify-metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu --verbose

      - name: Build Linux packages (.AppImage & .deb)
        env:
          VERSION: ${{ needs.verify-metadata.outputs.version }}
        run: |
          ./scripts/package_linux.sh target/x86_64-unknown-linux-gnu/release/lavaterm dist

      - name: Validate Linux packages & generate checksums
        working-directory: dist
        env:
          VERSION: ${{ needs.verify-metadata.outputs.version }}
        run: |
          APPIMAGE="ZenLavaTerm-v${VERSION}-linux-x86_64.AppImage"
          DEB="ZenLavaTerm-v${VERSION}-linux-x86_64.deb"

          test -s "$APPIMAGE" || { echo "::error::AppImage is missing or empty"; exit 1; }
          test -x "$APPIMAGE" || { echo "::error::AppImage is not executable"; exit 1; }
          test -s "$DEB" || { echo "::error::DEB package is missing or empty"; exit 1; }

          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB"

          sha256sum "$APPIMAGE" > "${APPIMAGE}.sha256"
          sha256sum "$DEB" > "${DEB}.sha256"

      - name: Upload Linux validation artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-linux
          path: |
            dist/ZenLavaTerm-v${{ needs.verify-metadata.outputs.version }}-linux-x86_64.AppImage
            dist/ZenLavaTerm-v${{ needs.verify-metadata.outputs.version }}-linux-x86_64.AppImage.sha256
            dist/ZenLavaTerm-v${{ needs.verify-metadata.outputs.version }}-linux-x86_64.deb
            dist/ZenLavaTerm-v${{ needs.verify-metadata.outputs.version }}-linux-x86_64.deb.sha256
          if-no-files-found: error
          retention-days: 3

  package-windows:
    name: Validate Windows Packaging (MSI x86_64)
    needs: verify-metadata
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc --verbose

      - name: Build Windows MSI Package
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/package_windows.ps1 -SourceBinaryDir "target\x86_64-pc-windows-msvc\release" -OutputDir "dist"

      - name: Validate Windows MSI & generate checksum
        shell: bash
        working-directory: dist
        env:
          VERSION: ${{ needs.verify-metadata.outputs.version }}
        run: |
          MSI="ZenLavaTerm-v${VERSION}-windows-x86_64.msi"
          test -s "$MSI" || { echo "::error::MSI installer is missing or empty"; exit 1; }
          sha256sum "$MSI" > "${MSI}.sha256"

      - name: Upload Windows validation artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-windows
          path: |
            dist/ZenLavaTerm-v${{ needs.verify-metadata.outputs.version }}-windows-x86_64.msi
            dist/ZenLavaTerm-v${{ needs.verify-metadata.outputs.version }}-windows-x86_64.msi.sha256
          if-no-files-found: error
          retention-days: 3

  package-macos:
    name: Validate macOS Packaging (Universal DMG)
    needs: verify-metadata
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain & targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build release binaries (Apple Silicon & Intel)
        run: |
          cargo build --release --target aarch64-apple-darwin --verbose
          cargo build --release --target x86_64-apple-darwin --verbose

      - name: Create Universal Binary
        run: |
          mkdir -p target/universal/release
          lipo -create -output target/universal/release/lavaterm \
            target/aarch64-apple-darwin/release/lavaterm \
            target/x86_64-apple-darwin/release/lavaterm
          lipo -info target/universal/release/lavaterm

      - name: Build macOS DMG package
        run: |
          ./scripts/package_macos.sh universal target/universal/release/lavaterm dist

      - name: Validate macOS DMG & generate checksum
        working-directory: dist
        env:
          VERSION: ${{ needs.verify-metadata.outputs.version }}
        run: |
          DMG="ZenLavaTerm-v${VERSION}-macos-universal.dmg"
          test -s "$DMG" || { echo "::error::DMG image is missing or empty"; exit 1; }
          shasum -a 256 "$DMG" > "${DMG}.sha256"

      - name: Upload macOS validation artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-macos
          path: |
            dist/ZenLavaTerm-v${{ needs.verify-metadata.outputs.version }}-macos-universal.dmg
            dist/ZenLavaTerm-v${{ needs.verify-metadata.outputs.version }}-macos-universal.dmg.sha256
          if-no-files-found: error
          retention-days: 3

  validate-artifacts:
    name: Verify Consolidated Artifact Manifest
    needs:
      - verify-metadata
      - package-linux
      - package-windows
      - package-macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all validation bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Validate all installer checksums and build consolidated manifest
        working-directory: dist
        run: |
          echo "=== Downloaded Staging Assets ==="
          ls -la

          echo "=== Verifying downloaded installers against builder checksums ==="
          for sha_file in *.sha256; do
            echo "Verifying $sha_file..."
            sha256sum -c "$sha_file"
          done

          echo "=== Generating consolidated SHA256SUMS.txt manifest ==="
          cat *.sha256 | sort -k2 -u > SHA256SUMS.txt

          echo "=== Consolidated Manifest Content ==="
          cat SHA256SUMS.txt

          echo "=== Final verification pass against consolidated manifest ==="
          sha256sum -c SHA256SUMS.txt
          echo "✅ All 4 official desktop installers successfully generated and verified!"
