name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: lavaterm
            asset_name: lavaterm-x86_64-unknown-linux-gnu
            use_cross: false

          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: lavaterm
            asset_name: lavaterm-x86_64-unknown-linux-musl
            use_cross: true

          - target: x86_64-apple-darwin
            os: macos-13
            artifact_name: lavaterm
            asset_name: lavaterm-x86_64-apple-darwin
            use_cross: false

          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: lavaterm
            asset_name: lavaterm-aarch64-apple-darwin
            use_cross: false

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: lavaterm.exe
            asset_name: lavaterm-x86_64-pc-windows-msvc
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if required)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --verbose
          else
            cargo build --release --target ${{ matrix.target }} --verbose
          fi
        shell: bash

      - name: Package artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          staging="staging"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "$staging/"
          cp README.md LICENSE "$staging/"
          tar -czf "${{ matrix.asset_name }}.tar.gz" -C "$staging" .
          shasum -a 256 "${{ matrix.asset_name }}.tar.gz" > "${{ matrix.asset_name }}.tar.gz.sha256"
        shell: bash

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $staging = "staging"
          New-Item -ItemType Directory -Force -Path $staging
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" -Destination $staging
          Copy-Item "README.md", "LICENSE" -Destination $staging
          Compress-Archive -Path "$staging/*" -DestinationPath "${{ matrix.asset_name }}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.asset_name }}.zip").Hash.ToLower()
          "$hash  ${{ matrix.asset_name }}.zip" | Out-File -Encoding ascii "${{ matrix.asset_name }}.zip.sha256"

      - name: Upload release assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.tar.gz.sha256
            ${{ matrix.asset_name }}.zip
            ${{ matrix.asset_name }}.zip.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-archlinux-package:
    name: Build & Package (Arch Linux x86_64)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git rust cargo zstd binutils

      - name: Configure build environment
        run: |
          git config --global --add safe.directory '*' || true
          useradd -m -s /bin/bash builduser || true
          su builduser -c "git config --global --add safe.directory '*'" || true
          chown -R builduser:builduser "$PWD"

      - name: Build Arch Linux package with makepkg
        run: |
          su builduser -c "export GIT_DISCOVERY_ACROSS_FILESYSTEM=1 && ./scripts/package_arch.sh"
        working-directory: .

      - name: Prepare release assets
        run: |
          cp target/arch_pkg/lavaterm-*.pkg.tar.zst* .
          ls -la lavaterm-*.pkg.tar.zst*

      - name: Upload Arch Linux package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lavaterm-*.pkg.tar.zst
            lavaterm-*.pkg.tar.zst.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
