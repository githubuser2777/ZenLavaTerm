name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify Production Tag & Version Consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check-version.outputs.version }}
      tag: ${{ steps.check-version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Verify Tag matches Cargo metadata package version
        id: check-version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"

          # Reject any pre-release candidate tags (-rc, -beta, -alpha, etc.)
          if [[ "$TAG_NAME" =~ -rc|-beta|-alpha ]]; then
            echo "::error::Tag '$TAG_NAME' is a pre-release candidate tag. Production releases only accept strict SemVer tags (e.g. v1.2.3). Use .github/workflows/package.yml for packaging validation."
            exit 1
          fi

          # Accept only strict production SemVer ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$
          if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '$TAG_NAME' is not a valid production SemVer tag (must match ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ without leading zeros)."
            exit 1
          fi

          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="lavaterm") | .version')
          EXPECTED_TAG="v${CARGO_VERSION}"

          echo "Detected Git Tag:             $TAG_NAME"
          echo "Detected Cargo Package Ver:   $CARGO_VERSION"
          echo "Expected Git Tag:             $EXPECTED_TAG"

          if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then
            echo "::error::Tag mismatch! Git tag '$TAG_NAME' does not match Cargo.toml package version '$CARGO_VERSION' (expected '$EXPECTED_TAG')."
            exit 1
          fi

          echo "version=${CARGO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"

  package-linux:
    name: Package Linux (AppImage & DEB x86_64)
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu --verbose

      - name: Build Linux packages (.AppImage & .deb)
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          ./scripts/package_linux.sh target/x86_64-unknown-linux-gnu/release/lavaterm dist

      - name: Validate Linux packages & generate checksums
        working-directory: dist
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          APPIMAGE="ZenLavaTerm-v${VERSION}-linux-x86_64.AppImage"
          DEB="ZenLavaTerm-v${VERSION}-linux-x86_64.deb"

          test -s "$APPIMAGE" || { echo "::error::AppImage is missing or empty"; exit 1; }
          test -x "$APPIMAGE" || { echo "::error::AppImage is not executable"; exit 1; }
          test -s "$DEB" || { echo "::error::DEB package is missing or empty"; exit 1; }

          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB"

          sha256sum "$APPIMAGE" > "${APPIMAGE}.sha256"
          sha256sum "$DEB" > "${DEB}.sha256"

      - name: Upload Linux artifact bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-linux
          path: |
            dist/ZenLavaTerm-v${{ needs.verify-tag.outputs.version }}-linux-x86_64.AppImage
            dist/ZenLavaTerm-v${{ needs.verify-tag.outputs.version }}-linux-x86_64.AppImage.sha256
            dist/ZenLavaTerm-v${{ needs.verify-tag.outputs.version }}-linux-x86_64.deb
            dist/ZenLavaTerm-v${{ needs.verify-tag.outputs.version }}-linux-x86_64.deb.sha256
          if-no-files-found: error
          retention-days: 7

  package-windows:
    name: Package Windows (MSI x86_64)
    needs: verify-tag
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Ensure WiX Toolset is available
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue) -or -not (Get-Command light.exe -ErrorAction SilentlyContinue)) {
            $wixPath = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
            if (-not (Test-Path "$wixPath\candle.exe")) {
              $wixPath = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
            }
            if (Test-Path "$wixPath\candle.exe") {
              echo "$wixPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } else {
              choco install wixtoolset --no-progress
              echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc --verbose

      - name: Build Windows MSI Package
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/package_windows.ps1 -SourceBinaryDir "target\x86_64-pc-windows-msvc\release" -OutputDir "dist"

      - name: Validate Windows MSI & generate checksum
        shell: bash
        working-directory: dist
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          MSI="ZenLavaTerm-v${VERSION}-windows-x86_64.msi"
          test -s "$MSI" || { echo "::error::MSI installer is missing or empty"; exit 1; }
          sha256sum "$MSI" > "${MSI}.sha256"

      - name: Upload Windows artifact bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-windows
          path: |
            dist/ZenLavaTerm-v${{ needs.verify-tag.outputs.version }}-windows-x86_64.msi
            dist/ZenLavaTerm-v${{ needs.verify-tag.outputs.version }}-windows-x86_64.msi.sha256
          if-no-files-found: error
          retention-days: 7

  package-macos:
    name: Package macOS (Universal DMG)
    needs: verify-tag
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain & targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build release binaries (Apple Silicon & Intel)
        run: |
          cargo build --release --target aarch64-apple-darwin --verbose
          cargo build --release --target x86_64-apple-darwin --verbose

      - name: Create Universal Binary
        run: |
          mkdir -p target/universal/release
          lipo -create -output target/universal/release/lavaterm \
            target/aarch64-apple-darwin/release/lavaterm \
            target/x86_64-apple-darwin/release/lavaterm
          lipo -info target/universal/release/lavaterm

      - name: Build macOS DMG package
        run: |
          ./scripts/package_macos.sh universal target/universal/release/lavaterm dist

      - name: Validate macOS DMG & generate checksum
        working-directory: dist
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          DMG="ZenLavaTerm-v${VERSION}-macos-universal.dmg"
          test -s "$DMG" || { echo "::error::DMG image is missing or empty"; exit 1; }
          shasum -a 256 "$DMG" > "${DMG}.sha256"

      - name: Upload macOS artifact bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-macos
          path: |
            dist/ZenLavaTerm-v${{ needs.verify-tag.outputs.version }}-macos-universal.dmg
            dist/ZenLavaTerm-v${{ needs.verify-tag.outputs.version }}-macos-universal.dmg.sha256
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs:
      - verify-tag
      - package-linux
      - package-windows
      - package-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifact bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Verify independent builder checksums and build consolidated manifest
        working-directory: dist
        run: |
          echo "=== Downloaded Release Assets ==="
          ls -la

          # 1. Independent Integrity Verification
          echo "=== Verifying downloaded installers against builder checksums ==="
          for sha_file in *.sha256; do
            echo "Verifying $sha_file..."
            sha256sum -c "$sha_file"
          done

          # 2. Build consolidated manifest from pre-validated builder checksums
          echo "=== Generating consolidated SHA256SUMS.txt manifest ==="
          cat *.sha256 | sort -k2 -u > SHA256SUMS.txt

          echo "=== Consolidated Manifest Content ==="
          cat SHA256SUMS.txt

          # 3. Final verification pass against consolidated manifest
          sha256sum -c SHA256SUMS.txt

      - name: Generate Artifact Attestations (SLSA Provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.msi
            dist/*.dmg


      - name: Generate Release Package Manifests (Homebrew & AUR)
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          set -e
          echo "Generating manifests for release version $VERSION..."
          
          # Download immutable source archive from tag to compute exact release checksum
          curl -sSfL -o source.tar.gz "https://github.com/githubuser2777/ZenLavaTerm/archive/refs/tags/v${VERSION}.tar.gz"
          test -s source.tar.gz
          SOURCE_SHA=$(sha256sum source.tar.gz | awk '{print $1}')
          echo "Release Source Archive SHA256: $SOURCE_SHA"

          # Prepare output bundle directory
          mkdir -p dist/packaging/homebrew dist/packaging/aur dist/packaging/arch
          cp packaging/homebrew/lavaterm.rb dist/packaging/homebrew/
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO dist/packaging/aur/
          cp packaging/arch/PKGBUILD dist/packaging/arch/

          # Update manifests in dist
          sed -i "s/__SOURCE_SHA__/${SOURCE_SHA}/g" dist/packaging/homebrew/lavaterm.rb dist/packaging/aur/PKGBUILD dist/packaging/aur/.SRCINFO dist/packaging/arch/PKGBUILD
          sed -i "s/sha256sums=('[^']*')/sha256sums=('${SOURCE_SHA}')/g" dist/packaging/arch/PKGBUILD dist/packaging/aur/PKGBUILD
          sed -i "s/v[0-9]\+\.[0-9]\+\.[0-9]\+/v${VERSION}/g" dist/packaging/homebrew/lavaterm.rb
          sed -i "s/pkgver=[0-9]\+\.[0-9]\+\.[0-9]\+/pkgver=${VERSION}/g" dist/packaging/aur/PKGBUILD dist/packaging/arch/PKGBUILD
          sed -i "s/pkgver = [0-9]\+\.[0-9]\+\.[0-9]\+/pkgver = ${VERSION}/g" dist/packaging/aur/.SRCINFO

          # Verify manifests contain correct hash and version
          grep -q "${SOURCE_SHA}" dist/packaging/homebrew/lavaterm.rb || { echo "Failed Homebrew verification"; exit 1; }
          grep -q "${SOURCE_SHA}" dist/packaging/aur/PKGBUILD || { echo "Failed AUR PKGBUILD verification"; exit 1; }
          grep -q "${SOURCE_SHA}" dist/packaging/aur/.SRCINFO || { echo "Failed AUR .SRCINFO verification"; exit 1; }
          grep -q "${SOURCE_SHA}" dist/packaging/arch/PKGBUILD || { echo "Failed Arch PKGBUILD verification"; exit 1; }

          # Package manifests into an archive for release attachment
          (cd dist/packaging && tar -czf ../lavaterm-package-manifests-v${VERSION}.tar.gz .)

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.verify-tag.outputs.tag }}
          name: ZenLavaTerm ${{ needs.verify-tag.outputs.tag }}
          files: |
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/*.deb
            dist/*.deb.sha256
            dist/*.msi
            dist/*.msi.sha256
            dist/*.dmg
            dist/*.dmg.sha256
            dist/SHA256SUMS.txt
            dist/lavaterm-package-manifests-v*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
