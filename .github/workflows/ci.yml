name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint-and-format:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting (cargo fmt)
        run: cargo fmt --check

      - name: Run clippy linter (cargo clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Typecheck / Cargo check
        run: cargo check --all-targets --all-features

  test-native:
    name: Test Suite (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 (glibc)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macOS x86_64 (Intel)
            os: macos-13
            target: x86_64-apple-darwin
          - name: macOS aarch64 (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Windows x86_64 (MSVC)
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build tests
        run: cargo test --no-run --target ${{ matrix.target }} --verbose

      - name: Build benchmarks
        run: cargo bench --no-run --target ${{ matrix.target }} --verbose

      - name: Run unit & integration tests
        run: cargo test --target ${{ matrix.target }} --verbose

      - name: Run headless smoke test (CLI validation)
        run: cargo run --target ${{ matrix.target }} -- --headless --frames 30

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --verbose

  cross-compile-check:
    name: Cross-Compilation Check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            use_cross: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (if x86_64 musl on Ubuntu)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (if required)
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check / Compile target
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross check --target ${{ matrix.target }}
          else
            cargo check --target ${{ matrix.target }}
          fi
        shell: bash

  security-audit:
    name: Security Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Security audit with RustSec
        uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
