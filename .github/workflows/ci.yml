name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check-and-format:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@a54c7eae9bbab2c131f7689ab4d9887713d73185 # stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be954172b8dded4e094c0c73 # v2.7.7

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test Suite (${{ matrix.os }})
    needs: check-and-format
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@a54c7eae9bbab2c131f7689ab4d9887713d73185 # stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be954172b8dded4e094c0c73 # v2.7.7

      - name: Build tests
        run: cargo test --no-run --verbose

      - name: Build benchmarks
        run: cargo bench --no-run --verbose

      - name: Run unit & integration tests
        run: cargo test --verbose

      - name: Build binary (Debug)
        run: cargo build --verbose

      - name: Build binary (Release)
        run: cargo build --release --verbose

  security-audit:
    name: Security Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@a54c7eae9bbab2c131f7689ab4d9887713d73185 # stable

      - name: Install and run cargo-audit
        run: |
          which cargo-audit || cargo install cargo-audit --locked
          cargo audit
