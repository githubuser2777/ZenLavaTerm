name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint-and-format:
    name: Code Quality & Linting (Ubuntu x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Check code formatting (cargo fmt)
        run: cargo fmt --check

      - name: Run clippy linter (cargo clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Typecheck / Cargo check
        run: cargo check --all-targets --all-features

  test-linux:
    name: Test Suite (Linux x86_64 glibc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: x86_64-unknown-linux-gnu

      - name: Install Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Build tests & benchmarks
        run: |
          cargo test --no-run --target x86_64-unknown-linux-gnu --verbose
          cargo bench --no-run --target x86_64-unknown-linux-gnu --verbose

      - name: Run unit & integration tests
        run: cargo test --target x86_64-unknown-linux-gnu --verbose

      - name: Run headless smoke test (CLI runtime validation)
        run: cargo run --target x86_64-unknown-linux-gnu -- --headless --frames 30

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu --verbose

      - name: Run comprehensive smoke test suite (PTY, Signals, TUI, Audio)
        run: python3 scripts/smoke_test.py target/x86_64-unknown-linux-gnu/release/lavaterm

  test-cross-platform:
    name: Representative Platform (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Windows x86_64 (MSVC)
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build tests
        run: cargo test --no-run --target ${{ matrix.target }} --verbose

      - name: Run unit & integration tests
        run: cargo test --target ${{ matrix.target }} --verbose

      - name: Run headless smoke test (CLI runtime validation)
        run: cargo run --target ${{ matrix.target }} -- --headless --frames 30

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --verbose

  cross-target-check:
    name: Cross-Target Verification (macOS Intel x86_64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: x86_64-apple-darwin

      - name: Check macOS Intel build
        run: cargo check --target x86_64-apple-darwin --verbose

  security-audit:
    name: Security Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Security audit with RustSec
        uses: rustsec/audit-check@dd51754d4e59da7395a4cd9b593f0ff2d61a9b95 # v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
