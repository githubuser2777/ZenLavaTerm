name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint-and-format:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@a54c7fe93be2c9592dd638e8cb4708c9009ec371 # stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@82a92a6e8fbeee08c6c4d4b1201c70e28a50619a # v2.7.5

      - name: Check code formatting (cargo fmt)
        run: cargo fmt --check

      - name: Run clippy linter (cargo clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Typecheck / Cargo check
        run: cargo check --all-targets --all-features

  test-native:
    name: Test Suite (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 (glibc)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macOS x86_64 (Intel)
            os: macos-13
            target: x86_64-apple-darwin
          - name: macOS aarch64 (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Windows x86_64 (MSVC)
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@a54c7fe93be2c9592dd638e8cb4708c9009ec371 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@82a92a6e8fbeee08c6c4d4b1201c70e28a50619a # v2.7.5
        with:
          key: ${{ matrix.target }}

      - name: Build tests
        run: cargo test --no-run --target ${{ matrix.target }} --verbose

      - name: Build benchmarks
        run: cargo bench --no-run --target ${{ matrix.target }} --verbose

      - name: Run unit & integration tests
        run: cargo test --target ${{ matrix.target }} --verbose

      - name: Run headless smoke test (CLI runtime validation)
        run: cargo run --target ${{ matrix.target }} -- --headless --frames 30

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --verbose

  cross-compile-check:
    name: Cross-Compilation Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            use_cross: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@a54c7fe93be2c9592dd638e8cb4708c9009ec371 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (if x86_64 musl on Ubuntu)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (if required)
        if: matrix.use_cross
        uses: taiki-e/install-action@b7ec42a8b32e039bf877c865fa3a47da2c8b0e77 # v2
        with:
          tool: cross

      - name: Rust Cache
        uses: Swatinem/rust-cache@82a92a6e8fbeee08c6c4d4b1201c70e28a50619a # v2.7.5
        with:
          key: ${{ matrix.target }}

      - name: Build release target binary (linking validation)
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --verbose
          else
            cargo build --release --target ${{ matrix.target }} --verbose
          fi
        shell: bash

  security-audit:
    name: Security Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Security audit with RustSec
        uses: rustsec/audit-check@2e76f827e7f7bbd4ec74a961f6874ebf4bf7834d # v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
