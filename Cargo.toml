[package]
name = "lavaterm"
version = "1.0.0"
edition = "2021"

authors = ["ZenLavaTerm Contributors"]
description = "A terminal-native ambient lava lamp and metaball visualizer"
readme = "README.md"
license = "MIT"
repository = "https://github.com/githubuser2777/ZenLavaTerm"
homepage = "https://github.com/githubuser2777/ZenLavaTerm"
keywords = ["terminal", "metaball", "lava-lamp", "visualizer", "ambient"]
categories = ["command-line-utilities", "graphics"]

[lib]
name = "lavaterm"
path = "src/lib.rs"

[[bin]]
name = "lavaterm"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
signal-hook = "0.3"
cpal = "0.15"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "field_and_render"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
