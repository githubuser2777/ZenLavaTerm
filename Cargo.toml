[package]
name = "lavaterm"
version = "0.1.0"
edition = "2021"
authors = ["ZenLavaTerm Contributors"]
description = "A terminal-native ambient lava lamp and metaball visualizer"
readme = "README.md"
license = "MIT"
keywords = ["terminal", "metaball", "lava-lamp", "visualizer", "ambient"]
categories = ["command-line-utilities", "graphics"]

[lib]
name = "lavaterm"
path = "src/lib.rs"

[[bin]]
name = "lavaterm"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
